
name: Free iOS Simulator Preview

run-name: "iPhone Simulator Preview #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Project folder relative to repository root
        required: true
        default: .
        type: string
      scheme:
        description: Xcode scheme (leave empty for automatic detection)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  simulator-preview:
    name: Build and launch iPhone Simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Detect Xcode project and scheme
        id: detect
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          REQUESTED_SCHEME: ${{ inputs.scheme }}
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/$PROJECT_PATH"
          IOS_DIR="$ROOT"

          if [[ -d "$ROOT/ios" ]]; then
            IOS_DIR="$ROOT/ios"
          fi

          if [[ -d "$ROOT/iosApp" && "$PROJECT_PATH" == "." ]]; then
            IOS_DIR="$ROOT/iosApp"
          fi

          WORKSPACE=$(find "$IOS_DIR" -maxdepth 4 -name '*.xcworkspace' -print -quit)
          PROJECT=$(find "$IOS_DIR" -maxdepth 4 -name '*.xcodeproj' -print -quit)

          if [[ -z "$WORKSPACE" && -z "$PROJECT" ]]; then
            echo "No .xcworkspace or .xcodeproj found under $IOS_DIR" >&2
            exit 1
          fi

          if [[ -n "$REQUESTED_SCHEME" ]]; then
            SCHEME="$REQUESTED_SCHEME"
          elif [[ -n "$WORKSPACE" ]]; then
            SCHEME=$(xcodebuild -list -json -workspace "$WORKSPACE" | jq -r '.workspace.schemes[0] // empty')
          else
            SCHEME=$(xcodebuild -list -json -project "$PROJECT" | jq -r '.project.schemes[0] // empty')
          fi

          if [[ -z "$SCHEME" ]]; then
            echo "Could not detect an Xcode scheme. Enter it in Builder Mobile." >&2
            exit 1
          fi

          echo "ios_dir=$IOS_DIR" >> "$GITHUB_OUTPUT"
          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: Install CocoaPods dependencies
        shell: bash
        env:
          IOS_DIR: ${{ steps.detect.outputs.ios_dir }}
        run: |
          if [[ -f "$IOS_DIR/Podfile" ]]; then
            pod install --project-directory="$IOS_DIR"
          fi

      - name: Build for iOS Simulator
        shell: bash
        env:
          WORKSPACE: ${{ steps.detect.outputs.workspace }}
          PROJECT: ${{ steps.detect.outputs.project }}
          SCHEME: ${{ steps.detect.outputs.scheme }}
        run: |
          set -euo pipefail

          DERIVED="$RUNNER_TEMP/SimulatorBuild"
          mkdir -p "$DERIVED"

          if [[ -n "$WORKSPACE" ]]; then
            xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath "$DERIVED" \
              CODE_SIGNING_ALLOWED=NO \
              build
          else
            xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -configuration Debug \
              -sdk iphonesimulator \
              -derivedDataPath "$DERIVED" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Boot iPhone Simulator
        id: boot
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          devices=[d for group in data["devices"].values() for d in group if d["isAvailable"] and d["name"].startswith("iPhone")]
          print(devices[0]["udid"] if devices else "")
          ')

          if [[ -z "$DEVICE_ID" ]]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi

          echo "device_id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Install, launch and capture preview
        shell: bash
        env:
          DEVICE_ID: ${{ steps.boot.outputs.device_id }}
        run: |
          set -euo pipefail

          APP=$(find "$RUNNER_TEMP/SimulatorBuild/Build/Products" -type d -name '*.app' -path '*iphonesimulator*' -print -quit)

          if [[ -z "$APP" ]]; then
            echo "Built .app not found" >&2
            exit 1
          fi

          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")

          OUT="$GITHUB_WORKSPACE/simulator-output"
          mkdir -p "$OUT"

          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch "$DEVICE_ID" "$BUNDLE_ID"

          sleep 12

          xcrun simctl io "$DEVICE_ID" screenshot "$OUT/preview.png"

          xcrun simctl io "$DEVICE_ID" recordVideo "$OUT/preview.mp4" &
          VIDEO_PID=$!

          sleep 10

          kill -INT "$VIDEO_PID" 2>/dev/null || true
          wait "$VIDEO_PID" 2>/dev/null || true

          test -s "$OUT/preview.png"
          test -s "$OUT/preview.mp4"

      - name: Upload simulator preview files
        uses: actions/upload-artifact@v4
        with:
          name: iPhone-Simulator-Preview-${{ github.run_number }}
          path: simulator-output/
          if-no-files-found: error
          retention-days: 7
